services:
  web:
    image: ghcr.io/YOUR_USERNAME/nextjs-chat-web:latest
    container_name: nextjs-chat-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen2.5:1.5b}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextjs-chat.rule=Host(`${DOMAIN_NAME:-chat.yourdomain.com}`)"
      - "traefik.http.routers.nextjs-chat.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.nextjs-chat.tls=true"
      - "traefik.http.routers.nextjs-chat.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}"
      - "traefik.http.services.nextjs-chat.loadbalancer.server.port=3000"