services:
  web:
    image: fadymissiha/hostinger-nextjs-ollama-chat:latest
    user: "0:0"
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - fast-chat_data:/app/data
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5:1.5b}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      AUTH_SIGNUP_CODE: ${AUTH_SIGNUP_CODE}
      AUTH_SMTP_HOST: ${AUTH_SMTP_HOST}
      AUTH_SMTP_PORT: ${AUTH_SMTP_PORT}
      AUTH_SMTP_USER: ${AUTH_SMTP_USER}
      AUTH_SMTP_PASS: ${AUTH_SMTP_PASS}
      AUTH_SMTP_FROM: ${AUTH_SMTP_FROM}
volumes:
  fast-chat_data:
